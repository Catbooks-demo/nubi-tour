name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    # 브랜치 보호의 필수 체크 이름. 바꾸지 않는다.
    name: web
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nubi
          POSTGRES_PASSWORD: nubi
          POSTGRES_DB: nubi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nubi"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://nubi:nubi@localhost:5432/nubi_test
      SESSION_SECRET: ci-only-secret
      APP_BASE_URL: http://localhost:3000
      JOBS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: DB 마이그레이션
        run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    # 손님 흐름을 실제 브라우저로: 시드 → 빌드 → next start → Playwright (모의 결제)
    name: e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nubi
          POSTGRES_PASSWORD: nubi
          POSTGRES_DB: nubi_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nubi"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://nubi:nubi@localhost:5432/nubi_e2e
      SESSION_SECRET: ci-only-secret
      APP_BASE_URL: http://localhost:3000
      JOBS_ENABLED: "false"
      SEED_STAFF_EMAIL: admin@nubi.test
      SEED_STAFF_PASSWORD: e2e-admin-pass
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: screens
          retention-days: 7
          if-no-files-found: ignore
