name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    # 브랜치 보호의 필수 체크 이름. 바꾸지 않는다.
    name: web
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nubi
          POSTGRES_PASSWORD: nubi
          POSTGRES_DB: nubi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nubi"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://nubi:nubi@localhost:5432/nubi_test
      SESSION_SECRET: ci-only-secret
      APP_BASE_URL: http://localhost:3000
      JOBS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: DB 마이그레이션
        run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
